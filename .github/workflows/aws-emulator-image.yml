name: AWS Emulator image

# Publishes ghcr.io/kubevela/aws-emulator:<version> for each new AWS Emulator release.
# AWS serves only its newest package, so this runs on a schedule: it downloads the
# package, reads the version from it, and builds and pushes only when that tag does not
# exist yet. A published tag is never overwritten.
#
# Nothing is pushed until the image has passed the tests, the smoke test under the same
# restrictions the manifest applies, and the vulnerability scan. A pushed image is
# signed and carries a provenance attestation and an SBOM.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "aws/**"
      - "go.mod"
      - ".github/workflows/aws-emulator-image.yml"

permissions: {}

concurrency:
  group: aws-emulator-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/kubevela/aws-emulator

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      publish: ${{ steps.published.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Test the launcher
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...

      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: aws/Dockerfile

      - name: Fetch the packages and read their version
        id: pkg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rpm >/dev/null
          version=$(aws/build.sh fetch)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "AWS Emulator $version"
          cat aws/release-info/SHA256SUMS

      - name: Is this version already published?
        id: published
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$VERSION is already published; nothing to push"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for the runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: aws/Dockerfile
          load: true
          tags: aws-emulator:test
          build-args: VERSION=${{ steps.pkg.outputs.version }}

      # The same restrictions the manifest applies: read-only root, no capabilities,
      # no privilege escalation, writable memory only for the home directory and /tmp.
      - name: Smoke test under the manifest's restrictions
        run: |
          docker run -d --name emulator -p 127.0.0.1:4566:4566 \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp --tmpfs /home/nonroot:uid=65532,gid=65532 \
            --memory 2g aws-emulator:test
          aws/smoke-test.sh http://127.0.0.1:4566 || { docker logs emulator; exit 1; }
          docker rm -f emulator

      # Operating-system packages with a fix available must not ship. Findings in the
      # emulator binary itself are AWS's to fix, so they are reported, not blocking.
      - name: Scan for fixable OS vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aws-emulator:test
          vuln-type: os
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Report every finding
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aws-emulator:test
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          exit-code: "0"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report
          path: trivy.sarif

      - name: Check the manifest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: aws/deploy
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "1"

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # the release that carries the manifest
      packages: write # the image
      id-token: write # keyless signing and the attestation
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fetch again, and stop if AWS released in between: the image must hold exactly
      # the version the build job tested.
      - name: Fetch the packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rpm >/dev/null
          version=$(aws/build.sh fetch)
          if [[ "$version" != "$VERSION" ]]; then
            echo "::error::AWS released $version while $VERSION was being tested; the next run publishes $version"
            exit 1
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push both architectures
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: aws/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          build-args: VERSION=${{ env.VERSION }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Attest how the image was built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Render the manifest for this version, pinned to the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          sed -e "s|ghcr.io/kubevela/aws-emulator:VERSION|$IMAGE:$VERSION@$DIGEST|" -e "s/VERSION/$VERSION/g" \
            aws/deploy/aws-emulator.yaml > "aws-emulator-$VERSION.yaml"
          cp aws/release-info/SHA256SUMS "aws-emulator-$VERSION-packages.sha256"

      - name: Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: aws-emulator-v${{ env.VERSION }}
          name: AWS Emulator ${{ env.VERSION }}
          body: |
            Image: `${{ env.IMAGE }}:${{ env.VERSION }}` (linux/amd64, linux/arm64)
            Digest: `${{ steps.push.outputs.digest }}`

            Built from AWS Emulator [v${{ env.VERSION }}](https://github.com/aws/aws-emulator/releases/tag/v${{ env.VERSION }}). The attached manifest deploys this version by digest. The checksums are of AWS's packages as downloaded. The README says how to verify the signature and the provenance.
          files: |
            aws-emulator-${{ env.VERSION }}.yaml
            aws-emulator-${{ env.VERSION }}-packages.sha256
